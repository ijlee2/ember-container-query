allowBuilds:
  "@percy/core": true
  "@percy/ember@https://codeload.github.com/ijlee2/percy-ember/tar.gz/e0de3dd8b2f35895eb4a00e96ca1a84a68cf86d5": true
  core-js: false
  protobufjs: false
  unrs-resolver: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@codemod-utils/*"
  - "@ijlee2-frontend-configs/*"
  - "ember-testem"

overrides:
  "testem": "^4.0.0-beta.1" # Due to ember-cli

packages:
  - "configs/**"
  - "docs-app"
  - "packages/ember-container-query"
  - "test-app"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*stylelint*"

resolvePeersFromWorkspaceRoot: false

verifyDepsBeforeRun: "warn"
